name: Playwright Automation Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  # Run every day at 9:00 AM IST
  # GitHub Actions cron uses UTC
  # 03:30 UTC = 09:00 AM IST
  schedule:
    - cron: "30 3 * * *"

  # Manual execution from GitHub Actions
  workflow_dispatch:
    inputs:

      environment:
        description: "Select test environment"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - staging
          - production

      test_type:
        description: "Select test type"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression
          - sanity

      browser:
        description: "Select browser"
        required: true
        default: "chromium"
        type: choice
        options:
          - chromium
          - firefox
          - webkit

# Prevent multiple executions of the same workflow
concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  test:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true

    steps:

      # --------------------------------------------------
      # Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------
      # Install Playwright browsers
      # --------------------------------------------------
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # --------------------------------------------------
      # Display execution information
      # --------------------------------------------------
      - name: Display test configuration
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: ${{ inputs.environment || 'qa' }}"
          echo "Test Type: ${{ inputs.test_type || 'smoke' }}"
          echo "Browser: ${{ inputs.browser || 'chromium' }}"
          echo "Test File: tests/Naukari-Apply.spec.ts"

      # --------------------------------------------------
      # Run Naukari Playwright test
      # --------------------------------------------------
      - name: Run Naukari Apply test
        run: |
          npx playwright test tests/Naukari-Apply.spec.ts \
            --project="${{ inputs.browser || 'chromium' }}"

      # --------------------------------------------------
      # Generate Allure report
      # --------------------------------------------------
      - name: Generate Allure report
        if: always()
        run: |
          npx allure generate allure-results \
            --clean \
            -o allure-report

      # --------------------------------------------------
      # Upload Allure report
      # --------------------------------------------------
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # --------------------------------------------------
      # Upload Playwright HTML report
      # --------------------------------------------------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # --------------------------------------------------
      # Upload Playwright test results
      # --------------------------------------------------
      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

      # --------------------------------------------------
      # Send test report through email
      # --------------------------------------------------
      - name: Send Playwright test report email
        if: always()
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "Playwright Automation Report - ${{ job.status }}"

          to: "abhijeet.kumar.qa@gmail.com"

          from: "Playwright Automation <abhijeet.kumar.qa@gmail.com>"

          body: |
            Playwright Automation Test Execution

            ==========================================

            Repository:
            ${{ github.repository }}

            Branch:
            ${{ github.ref_name }}

            Workflow:
            ${{ github.workflow }}

            Run Number:
            ${{ github.run_number }}

            Status:
            ${{ job.status }}

            Environment:
            ${{ inputs.environment || 'qa' }}

            Test Type:
            ${{ inputs.test_type || 'smoke' }}

            Browser:
            ${{ inputs.browser || 'chromium' }}

            Test File:
            tests/Naukari-Apply.spec.ts

            ==========================================

            Test reports have been generated and uploaded
            as GitHub Actions artifacts.

            View GitHub Actions Run:

            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

          attachments: |
            allure-report/**